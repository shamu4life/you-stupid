name = "you-stupid"
main = "src/index.js"
compatibility_date = "2025-09-01"
workers_dev = true

# Serve the real site files (page, css, js, the mp3, icons) as static assets.
# run_worker_first: route every request through the Worker so it can rewrite the
# page's unfurl-card URLs to absolute per host (assets still come from ASSETS).
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true

[observability]
enabled = true

[[routes]]
pattern = "uwutoowo.com"
custom_domain = true

[[routes]]
pattern = "casino.uwutoowo.com"
custom_domain = true

[[routes]]
pattern = "sorryifuckedyour.mom"
custom_domain = true

[[routes]]
pattern = "hotsinglesnear.you"
custom_domain = true

# The milf and singles hosts double as mbedfx embed domains (post link with
# the host swapped -> it unfurls as the post). Any path on them that this
# Worker has no file for is offered to the mbedfx Worker over this binding;
# only answers mbedfx marks `x-mbedfx-guest: served` are used (see
# askMbedfx in src/index.js). Same Cloudflare account required.
[[services]]
binding = "MBEDFX"
service = "mbedfx"
